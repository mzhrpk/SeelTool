          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.example.seel.ui.components.GlassCard
          import com.example.seel.ui.theme.AccentBlue
          import com.example.seel.ui.theme.GlassBorder
          import com.example.seel.ui.theme.TextPrimary
          import com.example.seel.ui.theme.TextSecondary
          import com.example.seel.viewmodel.SettingsViewModel

          @Composable
          fun SettingsScreen(vm: SettingsViewModel = viewModel()) {
              val embedMetadata by vm.embedMetadata.collectAsStateWithLifecycle()
              val highQuality by vm.highQualityAudio.collectAsStateWithLifecycle()

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  Spacer(Modifier.height(56.dp))

                  Text(
                      "Settings",
                      color = TextPrimary,
                      fontSize = 26.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(24.dp))

                  // Media Section
                  SectionHeader(title = "Media")
                  Spacer(Modifier.height(10.dp))

                  GlassCard(modifier = Modifier.fillMaxWidth()) {
                      Column {
                          SettingsSwitchRow(
                              icon = Icons.Filled.Album,
                              title = "Embed Metadata & Art",
                              subtitle = "Embed title, artist & thumbnail into downloaded files",
                              checked = embedMetadata,
                              onCheckedChange = { vm.setEmbedMetadata(it) }
                          )
                          HorizontalDivider(
                              modifier = Modifier.padding(vertical = 8.dp),
                              color = GlassBorder,
                              thickness = 0.5.dp
                          )
                          SettingsSwitchRow(
                              icon = Icons.Filled.GraphicEq,
                              title = "High Quality Audio (320kbps)",
                              subtitle = "Download as MP3 at highest bitrate (larger file size)",
                              checked = highQuality,
                              onCheckedChange = { vm.setHighQualityAudio(it) }
                          )
                      }
                  }

                  Spacer(Modifier.height(24.dp))

                  // About Section
                  SectionHeader(title = "About")
                  Spacer(Modifier.height(10.dp))

                  GlassCard(modifier = Modifier.fillMaxWidth()) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(
                              Icons.Filled.Info,
                              contentDescription = null,
                              tint = AccentBlue,
                              modifier = Modifier.size(22.dp)
                          )
                          Spacer(Modifier.width(12.dp))
                          Column {
                              Text("seel", color = TextPrimary, fontWeight = FontWeight.Bold)
                              Text("Version 1.0.0 · Your personal toolbox", color = TextSecondary, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SectionHeader(title: String) {
              Text(
                  text = title.uppercase(),
                  color = AccentBlue,
                  fontSize = 11.sp,
                  fontWeight = FontWeight.Bold,
                  letterSpacing = 1.5.sp
              )
          }

          @Composable
          private fun SettingsSwitchRow(
              icon: ImageVector,
              title: String,
              subtitle: String,
              checked: Boolean,
              onCheckedChange: (Boolean) -> Unit
          ) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(
                      icon,
                      contentDescription = null,
                      tint = AccentBlue,
                      modifier = Modifier.size(20.dp)
                  )
                  Spacer(Modifier.width(12.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(title, color = TextPrimary, fontWeight = FontWeight.Medium, fontSize = 14.sp)
                      Text(subtitle, color = TextSecondary, fontSize = 11.sp)
                  }
                  Switch(
                      checked = checked,
                      onCheckedChange = onCheckedChange,
                      colors = SwitchDefaults.colors(
                          checkedThumbColor = Color.White,
                          checkedTrackColor = AccentBlue,
                          uncheckedThumbColor = TextSecondary,
                          uncheckedTrackColor = GlassBorder
                      )
                  )
              }
          }
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/example/seel/MainActivity.kt << 'EOF'
          package com.example.seel

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.GridView
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.navigation.NavDestination.Companion.hierarchy
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import com.example.seel.ui.components.GradientBackground
          import com.example.seel.ui.screens.DashboardScreen
          import com.example.seel.ui.screens.DownloaderScreen
          import com.example.seel.ui.screens.OcrScreen
          import com.example.seel.ui.screens.SettingsScreen
          import com.example.seel.ui.theme.GlassWhite
          import com.example.seel.ui.theme.SeelTheme
          import com.example.seel.ui.theme.TextPrimary
          import com.example.seel.ui.theme.TextSecondary

          sealed class Screen(val route: String, val label: String, val icon: ImageVector) {
              object Dashboard : Screen("dashboard", "Dashboard", Icons.Filled.GridView)
              object Settings : Screen("settings", "Settings", Icons.Filled.Settings)
          }

          val bottomScreens = listOf(Screen.Dashboard, Screen.Settings)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      SeelTheme {
                          SeelApp()
                      }
                  }
              }
          }

          @Composable
          fun SeelApp() {
              val navController = rememberNavController()
              val navBackStackEntry by navController.currentBackStackEntryAsState()
              val currentDestination = navBackStackEntry?.destination

              val showBottomBar = currentDestination?.route in bottomScreens.map { it.route }

              GradientBackground {
                  Scaffold(
                      containerColor = Color.Transparent,
                      bottomBar = {
                          if (showBottomBar) {
                              NavigationBar(
                                  containerColor = GlassWhite,
                                  contentColor = TextPrimary
                              ) {
                                  bottomScreens.forEach { screen ->
                                      val selected = currentDestination?.hierarchy?.any { it.route == screen.route } == true
                                      NavigationBarItem(
                                          icon = {
                                              Icon(
                                                  screen.icon,
                                                  contentDescription = screen.label,
                                                  tint = if (selected) TextPrimary else TextSecondary
                                              )
                                          },
                                          label = {
                                              Text(
                                                  screen.label,
                                                  color = if (selected) TextPrimary else TextSecondary
                                              )
                                          },
                                          selected = selected,
                                          onClick = {
                                              navController.navigate(screen.route) {
                                                  popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                                  launchSingleTop = true
                                                  restoreState = true
                                              }
                                          },
                                          colors = NavigationBarItemDefaults.colors(
                                              indicatorColor = Color(0x33FFFFFF)
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  ) { innerPadding ->
                      Box(modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)) {
                          NavHost(
                              navController = navController,
                              startDestination = Screen.Dashboard.route,
                              modifier = Modifier.fillMaxSize()
                          ) {
                              composable(Screen.Dashboard.route) {
                                  DashboardScreen(onNavigateTo = { route ->
                                      navController.navigate(route)
                                  })
                              }
                              composable(Screen.Settings.route) {
                                  SettingsScreen()
                              }
                              composable("downloader") {
                                  DownloaderScreen(onBack = { navController.popBackStack() })
                              }
                              composable("ocr") {
                                  OcrScreen(onBack = { navController.popBackStack() })
                              }
                          }
                      }
                  }
              }
          }
          EOF

      # ─────────────────────────────────────────
      # 6. FIX OCR SCREEN: remove Coil import
      #    (not in dependencies — use placeholder)
      # ─────────────────────────────────────────

      - name: Rewrite OcrScreen without Coil dependency
        run: |
          cat > app/src/main/java/com/example/seel/ui/screens/OcrScreen.kt << 'EOF'
          package com.example.seel.ui.screens

          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.Image
          import androidx.compose.material.icons.filled.TextSnippet
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.example.seel.ui.components.GlassCard
          import com.example.seel.ui.theme.AccentTeal
          import com.example.seel.ui.theme.GlassBorder
          import com.example.seel.ui.theme.TextPrimary
          import com.example.seel.ui.theme.TextSecondary
          import com.example.seel.viewmodel.OcrState
          import com.example.seel.viewmodel.OcrViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun OcrScreen(onBack: () -> Unit, vm: OcrViewModel = viewModel()) {
              val imageUri by vm.selectedImageUri.collectAsStateWithLifecycle()
              val ocrState by vm.ocrState.collectAsStateWithLifecycle()

              val galleryLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri: Uri? -> uri?.let { vm.onImageSelected(it) } }

              Column(modifier = Modifier.fillMaxSize()) {
                  TopAppBar(
                      title = { Text("Text Extractor (OCR)", color = TextPrimary, fontWeight = FontWeight.Bold) },
                      navigationIcon = {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Filled.ArrowBack, contentDescription = "Back", tint = TextPrimary)
                          }
                      },
                      colors = TopAppBarDefaults.topAppBarColors(containerColor = Color.Transparent)
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(16.dp)
                          .verticalScroll(rememberScrollState()),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Spacer(Modifier.height(8.dp))

                      GlassCard(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(180.dp)
                      ) {
                          Box(
                              modifier = Modifier.fillMaxSize(),
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Icon(
                                      Icons.Filled.Image,
                                      contentDescription = null,
                                      tint = if (imageUri != null) AccentTeal else TextSecondary,
                                      modifier = Modifier.size(52.dp)
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Text(
                                      text = if (imageUri != null)
                                          imageUri.toString().substringAfterLast("/").take(40)
                                      else
                                          "No image selected",
                                      color = if (imageUri != null) TextPrimary else TextSecondary,
                                      fontSize = 12.sp
                                  )
                              }
                          }
                      }

                      Spacer(Modifier.height(16.dp))

                      OutlinedButton(
                          onClick = { galleryLauncher.launch("image/*") },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(50.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.outlinedButtonColors(contentColor = AccentTeal),
                          border = androidx.compose.foundation.BorderStroke(1.dp, AccentTeal)
                      ) {
                          Icon(Icons.Filled.Image, contentDescription = null, tint = AccentTeal)
                          Spacer(Modifier.width(8.dp))
                          Text("Pick Image / Open Camera", fontWeight = FontWeight.SemiBold)
                      }

                      Spacer(Modifier.height(12.dp))

                      Button(
                          onClick = { vm.extractText() },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(50.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = AccentTeal),
                          enabled = imageUri != null && ocrState !is OcrState.Processing
                      ) {
                          Icon(Icons.Filled.TextSnippet, contentDescription = null, tint = Color.White)
                          Spacer(Modifier.width(8.dp))
                          Text(
                              text = if (ocrState is OcrState.Processing) "Extracting..." else "Extract Text",
                              color = Color.White,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      Spacer(Modifier.height(20.dp))

                      GlassCard(
                          modifier = Modifier
                              .fillMaxWidth()
                              .defaultMinSize(minHeight = 120.dp)
                      ) {
                          when (val s = ocrState) {
                              is OcrState.Idle -> {
                                  Text(
                                      "Extracted text will appear here...",
                                      color = TextSecondary,
                                      fontSize = 13.sp
                                  )
                              }
                              is OcrState.Processing -> {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      CircularProgressIndicator(
                                          modifier = Modifier.size(20.dp),
                                          color = AccentTeal,
                                          strokeWidth = 2.dp
                                      )
                                      Spacer(Modifier.width(10.dp))
                                      Text("Processing image...", color = TextSecondary)
                                  }
                              }
                              is OcrState.Result -> {
                                  Column {
                                      Text(
                                          "Extracted Text",
                                          color = AccentTeal,
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 13.sp
                                      )
                                      Spacer(Modifier.height(8.dp))
                                      SelectionContainer {
                                          Text(s.text, color = TextPrimary, fontSize = 13.sp, lineHeight = 20.sp)
                                      }
                                  }
                              }
                              is OcrState.Error -> {
                                  Text(s.message, color = Color(0xFFEF9A9A))
                              }
                          }
                      }

                      Spacer(Modifier.height(16.dp))
                  }
              }
          }
          EOF

