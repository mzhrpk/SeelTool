name: Build Seel APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ─────────────────────────────────────────
      # 1. PROJECT ROOT FILES
      # ─────────────────────────────────────────

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "seel"
          include(":app")
          EOF

      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("com.android.library") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Set up Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" || \
          wget -q -O gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Create gradlew script
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd -P)"
          exec "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" "$@" 2>/dev/null || \
          java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW

          # Use the proper gradlew generation approach
          cat > gradlew << 'GRADLEW'
          #!/usr/bin/env sh
          ##############################################################################
          ## Gradle start up script for UN*X
          ##############################################################################
          APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
          APP_NAME="Gradle"
          APP_BASE_NAME=${0##*/}
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec "$JAVACMD" "$@" -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$APP_ARGS"
          GRADLEW
          chmod +x gradlew

      - name: Install Gradle wrapper properly
        run: |
          # Use the gradle wrapper plugin to generate proper gradlew
          cat > gradlew << 'EOF'
          #!/usr/bin/env sh
          #
          # Copyright 2015 the original author or authors.
          #
          # Licensed under the Apache License, Version 2.0 (the "License");
          # you may not use this file except in compliance with the License.
          # You may obtain a copy of the License at
          #
          #      https://www.apache.org/licenses/LICENSE-2.0
          #
          # Unless required by applicable law or agreed to in writing, software
          # distributed under the License is distributed on an "AS IS" BASIS,
          # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          # See the License for the specific language governing permissions and
          # limitations under the License.
          #

          ##############################################################################
          ##
          ##  Gradle start up script for UN*X
          ##
          ##############################################################################

          # Attempt to set APP_HOME
          # Resolve links: $0 may be a link
          app_path=$0

          # Need this for daisy-chained symlinks.
          while
              APP_HOME=${app_path%"${app_path##*/}"}  # leaves a trailing /; empty if no leading path
              [ -h "$app_path" ]
          do
              ls=$( ls -ld "$app_path" )
              link=${ls#*' -> '}
              case $link in             #(
                /*)   app_path=$link ;; #( absolute
                *)    app_path=$APP_HOME$link ;;
              esac
          done

          APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit

          APP_NAME="Gradle"
          APP_BASE_NAME=${0##*/}

          # Add default JVM options here. You can also use JAVA_OPTS and GRADLE_OPTS to pass JVM options to this script.
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'

          # Use the maximum available, or set MAX_FD != -1 to use that value.
          MAX_FD=maximum

          warn () {
              echo "$*"
          } >&2

          die () {
              echo
              echo "$*"
              echo
              exit 1
          } >&2

          # OS specific support (must be 'true' or 'false').
          cygwin=false
          msys=false
          darwin=false
          nonstop=false
          case "$( uname )" in                #(
            CYGWIN* )         cygwin=true  ;; #(
            Darwin* )         darwin=true  ;; #(
            MSYS* | MINGW* )  msys=true    ;; #(
            NONSTOP* )        nonstop=true ;;
          esac

          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar


          # Determine the Java command to use to start the JVM.
          if [ -n "$JAVA_HOME" ] ; then
              if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                  # IBM's JDK on AIX uses strange locations for the executables
                  JAVACMD=$JAVA_HOME/jre/sh/java
              else
                  JAVACMD=$JAVA_HOME/bin/java
              fi
              if [ ! -x "$JAVACMD" ] ; then
                  die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME

          Please set the JAVA_HOME variable in your environment to match the
          location of your Java installation."
              fi
          else
              JAVACMD=java
              if ! command -v java >/dev/null 2>&1
              then
                  die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH.

          Please set the JAVA_HOME variable in your environment to match the
          location of your Java installation."
              fi
          fi

          # Increase the maximum file descriptors if we can.
          if ! "$cygwin" && ! "$darwin" && ! "$nonstop" ; then
              case $MAX_FD in #(
                max*)
                  # In POSIX sh, ulimit -H is undefined. That's why the result is checked to see if it worked.
                  # shellcheck disable=SC2039,SC3045
                  MAX_FD=$( ulimit -H -n ) ||
                      warn "Could not query maximum file descriptor limit"
              esac
              case $MAX_FD in  #(
                '' | soft) :;; #(
                *)
                  # In POSIX sh, ulimit -n is undefined. That's why the result is checked to see if it worked.
                  # shellcheck disable=SC2039,SC3045
                  ulimit -n "$MAX_FD" ||
                      warn "Could not set maximum file descriptor limit to $MAX_FD"
              esac
          fi

          # Collect all arguments for the java command, stacking in reverse order:
          #   * args from the command line
          #   * the main class name
          #   * -classpath
          #   * -D...appname settings
          #   * --module-path (only if needed)
          #   * DEFAULT_JVM_OPTS, JAVA_OPTS, and GRADLE_OPTS environment variables.

          # For Cygwin or MSYS, switch paths to Windows format before running java
          if "$cygwin" || "$msys" ; then
              APP_HOME=$( cygpath --path --mixed "$APP_HOME" )
              CLASSPATH=$( cygpath --path --mixed "$CLASSPATH" )

              JAVACMD=$( cygpath --unix "$JAVACMD" )

              # Now convert the arguments - kludge to limit ourselves to /bin/sh
              for arg do
                  if
                      case $arg in                                #(
                        -*)   false ;;                            # don't mess with options  #(
                        /?*)  t=${arg#/} t=/${t%%/*}             # looks like a POSIX filepath
                              [ -e "$t" ] ;;                     #(
                        *)    false ;;
                      esac
                  then
                      arg=$( cygpath --path --ignore --mixed "$arg" )
                  fi
                  # Roll the args list around exactly as many times as the number of
                  # temporary variables.  (GPG is too slow for this hack.)
                  # shellcheck disable=SC2043
                  for i do
                      shift
                      set -- "$@" "$i"
                  done
                  set -- "$@" "$arg"
              done
          fi

          # Add default JVM options here. You can also use JAVA_OPTS and GRADLE_OPTS to pass JVM options to this script.
          set -- \
                  "-Dorg.gradle.appname=$APP_BASE_NAME" \
                  -classpath "$CLASSPATH" \
                  org.gradle.wrapper.GradleWrapperMain \
                  "$@"

          # Stop when "xargs" is not available.
          if ! command -v xargs >/dev/null 2>&1
          then
              die "xargs is not available"
          fi

          # Use "xargs" to parse quoted args.
          #
          # With -n1 it outputs one arg per line, with the quotes and backslashes removed.
          #
          # In Bash we could simply go:
          #
          #   readarray ARGS < <( xargs -n1 <<<"$var" ) &&
          #   set -- "${ARGS[@]}" "$@"
          #
          # but POSIX shell has neither arrays nor command substitution, so instead we
          # post-process each arg (as a line of input to sed) to backslash-escape any
          # character that might be a shell metacharacter, then use eval/set to
          # recreate the arg list.

          eval "set -- $(
                  printf '%s\n' "$DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS" |
                  xargs -n1 |
                  sed ' s~[^a-zA-Z0-9/=@._-]~\\&~g; ' |
                  tr '\n' ' '
                )" '"$@"'

          exec "$JAVACMD" "$@"
          EOF
          chmod +x gradlew

      # ─────────────────────────────────────────
      # 2. APP MODULE STRUCTURE
      # ─────────────────────────────────────────

      - name: Create directory structure
        run: |
          mkdir -p app/src/main/java/com/example/seel/ui/screens
          mkdir -p app/src/main/java/com/example/seel/ui/theme
          mkdir -p app/src/main/java/com/example/seel/ui/components
          mkdir -p app/src/main/java/com/example/seel/data
          mkdir -p app/src/main/java/com/example/seel/viewmodel
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/test/java/com/example/seel
          mkdir -p app/src/androidTest/java/com/example/seel

      - name: Create app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.seel"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.seel"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables { useSupportLibrary = true }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildFeatures { compose = true }

              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }

              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.6")
              implementation("androidx.datastore:datastore-preferences:1.0.0")

              // YoutubeDL Android
              implementation("com.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("com.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")

              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.1.5")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          EOF

      - name: Create proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'EOF'
          # Add project specific ProGuard rules here.
          -keep class com.yausername.** { *; }
          -keep class com.arthenica.** { *; }
          EOF

      # ─────────────────────────────────────────
      # 3. ANDROID MANIFEST
      # ─────────────────────────────────────────

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Seel"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.Seel">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF

      # ─────────────────────────────────────────
      # 4. RESOURCES
      # ─────────────────────────────────────────

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">seel</string>
          </resources>
          EOF

      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Seel" parent="android:Theme.Material.NoTitleBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

      - name: Create launcher icons (vector XML)
        run: |
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0F2027"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,30 C40.7,30 30,40.7 30,54 C30,67.3 40.7,78 54,78 C67.3,78 78
