          package com.example.seel.viewmodel

          import android.net.Uri
          import androidx.lifecycle.ViewModel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow

          sealed class OcrState {
              object Idle : OcrState()
              object Processing : OcrState()
              data class Result(val text: String) : OcrState()
              data class Error(val message: String) : OcrState()
          }

          class OcrViewModel : ViewModel() {
              private val _selectedImageUri = MutableStateFlow<Uri?>(null)
              val selectedImageUri: StateFlow<Uri?> = _selectedImageUri

              private val _ocrState = MutableStateFlow<OcrState>(OcrState.Idle)
              val ocrState: StateFlow<OcrState> = _ocrState

              fun onImageSelected(uri: Uri) {
                  _selectedImageUri.value = uri
                  _ocrState.value = OcrState.Idle
              }

              fun extractText() {
                  val uri = _selectedImageUri.value ?: run {
                      _ocrState.value = OcrState.Error("No image selected")
                      return
                  }
                  _ocrState.value = OcrState.Processing
                  // TODO: Integrate ML Kit / Tesseract OCR engine here
                  _ocrState.value = OcrState.Result(
                      "OCR engine not yet connected.\nSelected: $uri\n\nIntegrate Google ML Kit or Tesseract to enable text extraction."
                  )
              }

              fun reset() {
                  _selectedImageUri.value = null
                  _ocrState.value = OcrState.Idle
              }
          }
