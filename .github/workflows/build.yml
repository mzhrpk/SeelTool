          import com.example.seel.ui.theme.TextSecondary
          import com.example.seel.viewmodel.DownloadState
          import com.example.seel.viewmodel.DownloaderViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DownloaderScreen(onBack: () -> Unit, vm: DownloaderViewModel = viewModel()) {
              val state by vm.state.collectAsStateWithLifecycle()
              var url by remember { mutableStateOf("") }
              val keyboard = LocalSoftwareKeyboardController.current

              Column(modifier = Modifier.fillMaxSize()) {
                  TopAppBar(
                      title = {
                          Text("Media Downloader", color = TextPrimary, fontWeight = FontWeight.Bold)
                      },
                      navigationIcon = {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Filled.ArrowBack, contentDescription = "Back", tint = TextPrimary)
                          }
                      },
                      colors = TopAppBarDefaults.topAppBarColors(containerColor = Color.Transparent)
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(16.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Spacer(Modifier.height(16.dp))

                      GlassCard(modifier = Modifier.fillMaxWidth()) {
                          Column {
                              Text("Paste URL", color = TextSecondary, fontSize = 12.sp)
                              Spacer(Modifier.height(8.dp))
                              OutlinedTextField(
                                  value = url,
                                  onValueChange = { url = it },
                                  placeholder = { Text("https://youtube.com/...", color = TextSecondary, fontSize = 13.sp) },
                                  modifier = Modifier.fillMaxWidth(),
                                  colors = OutlinedTextFieldDefaults.colors(
                                      focusedTextColor = TextPrimary,
                                      unfocusedTextColor = TextPrimary,
                                      focusedBorderColor = AccentBlue,
                                      unfocusedBorderColor = GlassBorder,
                                      cursorColor = AccentBlue
                                  ),
                                  shape = RoundedCornerShape(12.dp),
                                  keyboardOptions = KeyboardOptions(
                                      keyboardType = KeyboardType.Uri,
                                      imeAction = ImeAction.Go
                                  ),
                                  keyboardActions = KeyboardActions(
                                      onGo = {
                                          keyboard?.hide()
                                          vm.download(url)
                                      }
                                  ),
                                  singleLine = true
                              )
                          }
                      }

                      Spacer(Modifier.height(20.dp))

                      val isDownloading = state is DownloadState.Downloading

                      Button(
                          onClick = {
                              keyboard?.hide()
                              if (isDownloading) return@Button
                              vm.download(url)
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = AccentBlue),
                          enabled = !isDownloading
                      ) {
                          Icon(Icons.Filled.Download, contentDescription = null, tint = Color.White)
                          Spacer(Modifier.width(8.dp))
                          Text(
                              text = if (isDownloading) "Downloading..." else "Download",
                              color = Color.White,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      Spacer(Modifier.height(24.dp))

                      when (val s = state) {
                          is DownloadState.Downloading -> {
                              GlassCard(modifier = Modifier.fillMaxWidth()) {
                                  Column {
                                      Text("Downloading...", color = TextPrimary, fontWeight = FontWeight.SemiBold)
                                      Spacer(Modifier.height(8.dp))
                                      LinearProgressIndicator(
                                          progress = { s.progress },
                                          modifier = Modifier.fillMaxWidth(),
                                          color = AccentBlue,
                                          trackColor = GlassBorder
                                      )
                                      Spacer(Modifier.height(6.dp))
                                      Text(
                                          text = s.line.take(80),
                                          color = TextSecondary,
                                          fontSize = 11.sp
                                      )
                                  }
                              }
                          }
                          is DownloadState.Success -> {
                              GlassCard(modifier = Modifier.fillMaxWidth()) {
                                  Column {
                                      Text("Download complete!", color = Color(0xFF81C784), fontWeight = FontWeight.Bold)
                                      Spacer(Modifier.height(4.dp))
                                      Text(s.filePath.substringAfterLast("/"), color = TextSecondary, fontSize = 12.sp)
                                      Spacer(Modifier.height(8.dp))
                                      TextButton(onClick = { vm.reset(); url = "" }) {
                                          Text("Download another", color = AccentBlue)
                                      }
                                  }
                              }
                          }
                          is DownloadState.Error -> {
                              GlassCard(modifier = Modifier.fillMaxWidth()) {
                                  Column {
                                      Text("Error", color = Color(0xFFEF9A9A), fontWeight = FontWeight.Bold)
                                      Spacer(Modifier.height(4.dp))
                                      Text(s.message, color = TextSecondary, fontSize = 12.sp)
                                      Spacer(Modifier.height(8.dp))
                                      TextButton(onClick = { vm.reset() }) {
                                          Text("Try again", color = AccentBlue)
                                      }
                                  }
                              }
                          }
                          else -> {}
                      }
                  }
              }
          }
